version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
 
  app:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app
volumes:
  postgres_data:
